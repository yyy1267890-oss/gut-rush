window.GutRush.DigestionEngine = class DigestionEngine {
  static calculate(foods) {
    if (!foods || foods.length === 0) {
      return { bristolType: 1, label: 'Type 1 - Hard Lumps', transitSpeed: 0.3, scoreLabel: 'Constipation - No fiber intake!', foodCount: 0 };
    }

    let totalFiber = 0, totalFat = 0, totalWater = 0, hasSorbitol = 0, hasStimulant = 0;

    for (const f of foods) {
      totalFiber += f.fiber || 0;
      totalFat += f.fat || 0;
      totalWater += f.water || 0;
      if (f.sorbitol) hasSorbitol = 1;
      if (f.stimulant) hasStimulant = 1;
    }

    let bristolType;
    let label;
    let transitSpeed;
    let scoreLabel;

    const fiberScore = totalFiber;
    const fatScore = totalFat;

    if (hasSorbitol && hasStimulant) {
      if (fiberScore >= 20 && fatScore < 8) {
        bristolType = 6; label = 'Type 6 - Fluffy & mushy'; transitSpeed = 2.0;
        scoreLabel = 'Too fast! Fiber + stimulants + sorbitol rushed things';
      } else {
        bristolType = 7; label = 'Type 7 - Watery'; transitSpeed = 2.5;
        scoreLabel = 'Emergency! Sorbitol + stimulants = rush to the toilet';
      }
    } else if (fiberScore >= 30 && totalWater < 2) {
      bristolType = 1; label = 'Type 1 - Hard lumps'; transitSpeed = 0.3;
      scoreLabel = 'Paradoxical! High fiber but no water = concrete-like stool';
    } else if (fiberScore >= 25 && (hasSorbitol || hasStimulant)) {
      bristolType = 5; label = 'Type 5 - Soft blobs'; transitSpeed = 1.8;
      scoreLabel = 'Loose stool - too much fiber combined with sorbitol or stimulants';
    } else if (fiberScore >= 10 && hasSorbitol) {
      bristolType = 5; label = 'Type 5 - Soft blobs'; transitSpeed = 1.5;
      scoreLabel = 'Fiber + sorbitol made things loose';
    } else if (fiberScore >= 20 && fatScore < 5) {
      bristolType = 3; label = 'Type 3 - Sausage with cracks (Ideal)'; transitSpeed = 1.0;
      scoreLabel = 'Ideal! Well-balanced high fiber intake';
    } else if (fiberScore >= 15 && fatScore < 8) {
      bristolType = 4; label = 'Type 4 - Smooth & soft (Ideal)'; transitSpeed = 1.0;
      scoreLabel = 'Great! Smooth and healthy stool';
    } else if (fiberScore < 5 && fatScore >= 10) {
      bristolType = 1; label = 'Type 1 - Hard lumps'; transitSpeed = 0.2;
      scoreLabel = 'Constipation - Too much junk food, no fiber';
    } else if (fiberScore >= 15 && fatScore >= 8) {
      bristolType = 2; label = 'Type 2 - Lumpy sausage'; transitSpeed = 0.4;
      scoreLabel = 'Fat slowed things down despite decent fiber';
    } else if (fiberScore < 8 && fatScore >= 5) {
      bristolType = 2; label = 'Type 2 - Lumpy sausage'; transitSpeed = 0.35;
      scoreLabel = 'Constipated - Low fiber, high fat diet';
    } else if (fiberScore >= 10 && fiberScore < 15) {
      bristolType = 3; label = 'Type 3 - Sausage with cracks'; transitSpeed = 0.8;
      scoreLabel = 'Decent! Moderate fiber gave a reasonable result';
    } else if (fiberScore >= 8 && fiberScore < 10) {
      bristolType = 3; label = 'Type 3 - Sausage with cracks'; transitSpeed = 0.7;
      scoreLabel = 'Moderate fiber, decent result';
    } else {
      bristolType = 2; label = 'Type 2 - Lumpy sausage'; transitSpeed = 0.4;
      scoreLabel = 'Suboptimal - try eating more fiber-rich foods next time';
    }

    return { bristolType, label, transitSpeed, scoreLabel, totalFiber, totalFat, totalWater, hasSorbitol, hasStimulant, foodCount: foods.length };
  }
};

window.GutRush.ScoreCalculator = class ScoreCalculator {
  static calculate(result, tapPerformance, egestionSkill, totalElapsed) {
    const { bristolType, totalFiber, totalFat, totalWater } = result;
    const maxTap = tapPerformance || 0;

    let shapeScore = 0;
    if (bristolType === 3 || bristolType === 4) shapeScore = 20;
    else if (bristolType === 5) shapeScore = 14;
    else if (bristolType === 2) shapeScore = 10;
    else if (bristolType === 1) shapeScore = 4;
    else if (bristolType === 6) shapeScore = 8;
    else if (bristolType === 7) shapeScore = 2;

    let sizeScore = 0;
    const foodCount = result.foodCount || 1;
    if (foodCount >= 8) sizeScore = 15;
    else if (foodCount >= 6) sizeScore = 12;
    else if (foodCount >= 4) sizeScore = 9;
    else if (foodCount >= 2) sizeScore = 6;
    else sizeScore = 3;

    let consistencyScore = 0;
    const fiberRatio = totalFiber / Math.max(1, totalFiber + totalFat);
    if (fiberRatio > 0.7 && totalWater >= 1) consistencyScore = 15;
    else if (fiberRatio > 0.5 && totalWater >= 1) consistencyScore = 12;
    else if (fiberRatio > 0.3) consistencyScore = 8;
    else if (totalFat > totalFiber) consistencyScore = 3;
    else consistencyScore = 6;

    let speedScore = 0;
    if (totalElapsed !== undefined) {
      if (totalElapsed < 45) speedScore = 10;
      else if (totalElapsed < 60) speedScore = 8;
      else if (totalElapsed < 90) speedScore = 6;
      else if (totalElapsed < 120) speedScore = 4;
      else speedScore = 2;
    }

    let controlScore = 0;
    if (maxTap >= 12) controlScore = 15;
    else if (maxTap >= 8) controlScore = 12;
    else if (maxTap >= 5) controlScore = 9;
    else if (maxTap >= 2) controlScore = 6;
    else controlScore = 3;

    let egestionScore = 0;
    if (egestionSkill === undefined) egestionScore = controlScore;
    else if (egestionSkill >= 3) egestionScore = 40;
    else if (egestionSkill >= 2) egestionScore = 30;
    else if (egestionSkill >= 1.5) egestionScore = 20;
    else if (egestionSkill >= 0.5) egestionScore = 10;
    else egestionScore = 4;

    return {
      shapeScore,
      sizeScore,
      consistencyScore,
      speedScore,
      controlScore,
      egestionScore,
      total: shapeScore + sizeScore + consistencyScore + speedScore + (egestionSkill === undefined ? controlScore : egestionScore),
      breakdown: [
        { name: 'Shape', score: shapeScore, max: 20, detail: bristolType === 3 || bristolType === 4 ? 'Ideal Bristol type!' : `Bristol Type ${bristolType} - not optimal` },
        { name: 'Size/Amount', score: sizeScore, max: 15, detail: foodCount >= 6 ? 'Good variety of foods' : 'Too few food items' },
        { name: 'Consistency', score: consistencyScore, max: 15, detail: fiberRatio > 0.5 && totalWater >= 1 ? 'Good fiber-water balance' : fiberRatio > 0.3 ? 'Moderate balance' : 'Poor fiber-water balance' },
        { name: 'Speed', score: speedScore, max: 10, detail: totalElapsed !== undefined ? `Cleared in ${totalElapsed.toFixed(0)}s` : 'Time not tracked' },
        { name: egestionSkill === undefined ? 'Passage Control' : 'Egestion Skill', score: egestionSkill === undefined ? controlScore : egestionScore, max: 40, detail: egestionSkill >= 2 ? 'Perfect release timing!' : egestionSkill >= 1 ? 'Decent timing' : 'Poor release timing' },
      ]
    };
  }
};

window.GutRush.clearGame = () => { try { localStorage.removeItem('gutrush_save'); } catch {} };

window.GutRush.PvPManager = class PvPManager {
  static generateMatch(code, numPlayers) {
    return new Promise((resolve, reject) => {
      const peer = new Peer(code);
      const timeout = setTimeout(() => reject(new Error('Timed out waiting for players')), 120000);
      const conns = [];
      peer.on('open', () => {
        peer.on('connection', (conn) => {
          conns.push(conn);
          if (conns.length >= numPlayers - 1) {
            clearTimeout(timeout);
            resolve({ conns, peer });
          }
        });
      });
      peer.on('error', (err) => { clearTimeout(timeout); reject(err); });
    });
  }

  static joinMatch(code) {
    return new Promise((resolve, reject) => {
      const peer = new Peer();
      const timeout = setTimeout(() => reject(new Error('Connection timed out')), 20000);
      peer.on('open', () => {
        const conn = peer.connect(code, { reliable: true });
        const connTimeout = setTimeout(() => reject(new Error('Failed to reach host')), 15000);
        conn.on('open', () => {
          clearTimeout(connTimeout);
          clearTimeout(timeout);
          conn.send({ type: 'join_request' });
          const welcomeTimeout = setTimeout(() => reject(new Error('No response from host')), 15000);
          conn.on('data', (d) => {
            if (d.type === 'welcome') {
              clearTimeout(welcomeTimeout);
              resolve({ conn, peer, playerIdx: d.playerIdx, numPlayers: d.numPlayers });
            }
          });
        });
        conn.on('error', (err) => { clearTimeout(timeout); reject(err); });
      });
      peer.on('error', (err) => { clearTimeout(timeout); reject(err); });
    });
  }

  static getWinner(match) {
    if (!match) return null;
    const players = Object.values(match).filter(Boolean);
    if (players.length < 2) return null;
    let best = players[0];
    for (let i = 1; i < players.length; i++) {
      if (players[i].score > best.score) best = players[i];
    }
    return best;
  }
};

window.GutRush.BootScene = class BootScene extends Phaser.Scene {
  constructor() { super('BootScene'); }

  preload() {
    const g = this.make.graphics({ add: false });
    g.fillStyle(0x8B4513, 1);
    g.fillCircle(8, 8, 8);
    g.generateTexture('bolus', 16, 16);
    const pg = this.make.graphics({ add: false });
    pg.fillStyle(0xffffff, 1);
    pg.fillCircle(2, 2, 2);
    pg.generateTexture('particle', 4, 4);
    pg.destroy();
    g.destroy();
  }

  create() {
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;

    this.showMainMenu();
  }

  promptNickname(callback) {
    const w = 800, h = 600, pixelFont = '"Press Start 2P", monospace';
    this.cameras.main.setBackgroundColor('#0a0a2e');

    const overlay = this.add.graphics(); overlay.setDepth(5);
    const gradSteps = 60;
    for (let i = 0; i < gradSteps; i++) {
      const t = i / gradSteps;
      const r = Math.round(Phaser.Math.Linear(16, 10, t));
      const g = Math.round(Phaser.Math.Linear(16, 10, t));
      const b = Math.round(Phaser.Math.Linear(46, 26, t));
      overlay.fillStyle(Phaser.Display.Color.GetColor(r, g, b), 1);
      overlay.fillRect(0, (i / gradSteps) * h, w, h / gradSteps + 1);
    }

    const scanlines = this.add.graphics(); scanlines.setDepth(6);
    for (let y = 0; y < h; y += 4) {
      scanlines.fillStyle(0x000000, 0.06);
      scanlines.fillRect(0, y, w, 1);
    }

    const particles = this.add.particles(0, 0, 'particle', {
      x: { min: 0, max: w }, y: h + 10,
      speed: { min: 8, max: 25 }, angle: { min: 255, max: 285 },
      scale: { start: 0.6, end: 0 }, alpha: { start: 0.5, end: 0 },
      lifespan: { min: 6000, max: 12000 }, frequency: 400, quantity: 1,
      blendMode: 'ADD'
    }); particles.setDepth(7);

    const title = this.add.text(w / 2, 80, 'GUT RUSH', { fontSize: '42px', fill: '#e94560', fontFamily: pixelFont, fontStyle: 'bold' }).setOrigin(0.5).setDepth(10);
    title.setShadow(0, 0, '#ff6b6b', 3, true, true);

    const nicknameText = this.add.text(w / 2, 155, 'Enter your nickname', { fontSize: '11px', fill: '#FFE082', fontFamily: pixelFont }).setOrigin(0.5).setDepth(15);
    const nameDisplay = this.add.text(w / 2, 230, '_', { fontSize: '32px', fill: '#fff', fontFamily: pixelFont }).setOrigin(0.5).setDepth(15);
    this.tweens.add({ targets: nameDisplay, alpha: 0.3, duration: 500, yoyo: true, repeat: -1 });

    let name = '';
    const isBrainrot = (s) => /\b67\b/.test(s) || s.toLowerCase().includes('skibidi');
    const rejectBrainrot = () => {
      const ft = this.add.text(w / 2, 270, 'NO BRAINROT!', { fontSize: '14px', fill: '#f44336', fontFamily: pixelFont, stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(30);
      this.tweens.add({ targets: ft, alpha: 0, y: 290, duration: 1500, onComplete: () => ft.destroy() });
    };
    const mobileInput = document.createElement('input');
    mobileInput.type = 'text'; mobileInput.autocomplete = 'off'; mobileInput.autocorrect = 'off';
    mobileInput.autocapitalize = 'off'; mobileInput.spellcheck = false;
    Object.assign(mobileInput.style, {
      position: 'fixed', left: '-200px', top: '-200px', width: '1px', height: '1px',
      opacity: '0', pointerEvents: 'none', zIndex: '-1'
    });
    document.body.appendChild(mobileInput);
    const cleanup = () => {
      window.removeEventListener('keydown', keyHandler);
      mobileInput.removeEventListener('input', inputHandler);
      mobileInput.removeEventListener('blur', blurHandler);
      document.body.removeChild(mobileInput);
      const all = [nicknameText, nameDisplay, overlay, scanlines, particles, title, hint, confirmBtn, confirmBg];
      all.forEach(e => e.destroy());
    };
    const accept = () => {
      if (name.length > 0 && !isBrainrot(name)) {
        window.GutRush.playerName = name;
        cleanup();
        callback(name);
      } else if (isBrainrot(name)) {
        rejectBrainrot();
      }
    };
    const updateDisplay = () => { nameDisplay.setText((name + '_').slice(0, 15)); if (name.length > 0) nameDisplay.setAlpha(1); };
    const sanitize = (s) => s.replace(/[^\w ]/g, '').slice(0, 14);
    let ignoreNextInput = false;
    const inputHandler = () => {
      if (ignoreNextInput) { ignoreNextInput = false; return; }
      name = sanitize(mobileInput.value);
      ignoreNextInput = true;
      mobileInput.value = name;
      updateDisplay();
    };
    const blurHandler = () => { this.time.delayedCall(100, () => { if (mobileInput.isConnected) mobileInput.focus(); }); };
    const keyHandler = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); accept(); }
    };
    window.addEventListener('keydown', keyHandler);
    mobileInput.addEventListener('input', inputHandler);
    mobileInput.addEventListener('blur', blurHandler);
    this.time.delayedCall(200, () => { mobileInput.focus(); });

    const hint = this.add.text(w / 2, 325, 'Up to 14 characters — tap Confirm', { fontSize: '12px', fill: '#e0e0e0', fontFamily: pixelFont }).setOrigin(0.5).setDepth(10);

    const confirmBg = this.add.graphics(); confirmBg.setDepth(10);
    const btnW = 280, btnH = 68, btnX = w / 2 - btnW / 2, btnY = 365;
    const drawBtn = (fill, stroke) => {
      confirmBg.clear();
      confirmBg.fillStyle(fill, 1);
      confirmBg.fillRoundedRect(btnX, btnY, btnW, btnH, 10);
      confirmBg.lineStyle(3, stroke, 1);
      confirmBg.strokeRoundedRect(btnX, btnY, btnW, btnH, 10);
    };
    drawBtn(0x0d4b0d, 0x66BB6A);
    const confirmBtn = this.add.text(w / 2, btnY + btnH / 2 + 1, 'CONFIRM', { fontSize: '24px', fill: '#A5D6A7', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(11).setInteractive({ useHandCursor: true });
    confirmBtn.on('pointerover', () => { drawBtn(0x1a6c1a, 0x81C784); confirmBtn.setScale(1.05); confirmBtn.setFill('#C8E6C9'); });
    confirmBtn.on('pointerout', () => { drawBtn(0x0d4b0d, 0x66BB6A); confirmBtn.setScale(1); confirmBtn.setFill('#A5D6A7'); });
    confirmBtn.on('pointerdown', accept);
  }

  showMainMenu() {
    const w = this.cameras.main.width;
    const h = this.cameras.main.height;
    const withNickname = (fn) => {
      if (window.GutRush.playerName) { fn(); }
      else { this.promptNickname(() => fn()); }
    };

    this.cameras.main.setBackgroundColor('#0a0a1a');
    const title = this.add.text(w / 2, h / 2 - 70, 'GUT RUSH', { fontSize: '56px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setAlpha(0);
    const sub = this.add.text(w / 2, h / 2 - 10, 'A Digestion Adventure', { fontSize: '16px', fill: '#888', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5).setAlpha(0);

    this.tweens.add({ targets: title, alpha: 1, y: h / 2 - 60, duration: 800, ease: 'Power2' });

  showHostSetup() {
    const w = 800, h = 600;
    const bg = this.add.graphics(); bg.fillStyle(0x0a0a1a, 0.95); bg.fillRect(0, 0, w, h); bg.setDepth(20);

    const sub = this.add.text(w / 2, 170, 'How many players?', { fontSize: '18px', fill: '#aaa', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5).setDepth(25);

    const numBtns = [], btnSpacing = 65, startX = w / 2 - (3 * btnSpacing);

      const b = this.add.text(startX + ((n - 2) * btnSpacing), 230, `[${n}]`, { fontSize: '22px', fill: '#4CAF50', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
      b.on('pointerover', () => b.setFill('#81C784'));
      b.on('pointerout', () => b.setFill('#4CAF50'));
      b.on('pointerdown', () => { elems.forEach(e => e.destroy()); this.startPvPHost(n); });
      numBtns.push(b);
    }

    const cancelBtn = this.add.text(w / 2, 310, '[ Cancel ]', { fontSize: '16px', fill: '#f44336', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    cancelBtn.on('pointerdown', () => elems.forEach(e => e.destroy()));

    const elems = [bg, title, sub, ...numBtns, cancelBtn];
  }

  startPvPHost(numPlayers) {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const code = Array.from({ length: 6 }, () => chars[Math.floor(Math.random() * chars.length)]).join('');
    const w = 800, h = 600;

    const bg = this.add.graphics(); bg.fillStyle(0x0a0a1a, 0.95); bg.fillRect(0, 0, w, h); bg.setDepth(20);
    bg.setInteractive(new Phaser.Geom.Rectangle(0, 0, w, h), Phaser.Geom.Rectangle.Contains);

    this.add.text(w / 2, 120, `Share this code with ${numPlayers - 1} player${numPlayers > 2 ? 's' : ''}`, { fontSize: '16px', fill: '#aaa', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5).setDepth(25);
    const codeText = this.add.text(w / 2, 190, code, { fontSize: '52px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    const copyHint = this.add.text(w / 2, 230, '(tap code to copy)', { fontSize: '14px', fill: '#666', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5).setDepth(25);
    codeText.on('pointerdown', () => { navigator.clipboard.writeText(code).catch(() => {}); copyHint.setText('✓ Copied!'); });

    const totalJoiners = numPlayers - 1;
    let joinedCount = 0;
    const waitText = this.add.text(w / 2, 300, `Connected: (${joinedCount}/${totalJoiners})`, { fontSize: '18px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(25);
    this.tweens.add({ targets: waitText, alpha: 0.3, duration: 800, yoyo: true, repeat: -1 });

    const startBtn = this.add.text(w / 2, 370, '[ Start Game ]', { fontSize: '22px', fill: '#555', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(25);
    const cancelBtn = this.add.text(w / 2, 430, '[ Cancel ]', { fontSize: '16px', fill: '#f44336', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    cancelBtn.on('pointerdown', () => { if (peer) peer.destroy(); elems.forEach(e => e.destroy()); });

    let peer = null;
    const elems = [bg, codeText, copyHint, waitText, startBtn, cancelBtn];
    const update = () => {
      joinedCount++;
      const allIn = joinedCount >= totalJoiners;
      waitText.setText(`Connected: (${joinedCount}/${totalJoiners})`);
      startBtn.setFill(allIn ? '#4CAF50' : '#555');
      startBtn.removeAllListeners('pointerdown');
      if (allIn) {
        startBtn.setInteractive({ useHandCursor: true });
        startBtn.on('pointerover', () => startBtn.setFill('#81C784'));
        startBtn.on('pointerout', () => startBtn.setFill('#4CAF50'));
        startBtn.on('pointerdown', () => {
          startBtn.removeAllListeners('pointerdown');
          window.GutRush._pvpConns.forEach((conn, i) => conn.send({ type: 'game_start', numPlayers }));
          elems.forEach(e => e.destroy());
          window.GutRush.pvpMode = true;
          window.GutRush._pvpNumPlayers = numPlayers;
          window.GutRush._pvpMyIdx = 0;
          this.startGame();
        });
      }
    };

    window.GutRush._pvpIsHost = true;
    window.GutRush.pvpCode = code;

    window.GutRush.PvPManager.generateMatch(code, numPlayers).then(({ conns, peer: p }) => {
      peer = p;
      window.GutRush._pvpConns = conns;
      window.GutRush._pvpPeer = peer;
      window.GutRush._pvpRecv = [];
      conns.forEach((conn, i) => {
        const playerIdx = i + 1;
        conn.send({ type: 'welcome', playerIdx, numPlayers });
        conn.on('data', (d) => {
          if (d.type === 'join_request') { conn.send({ type: 'welcome', playerIdx, numPlayers }); }
          else { window.GutRush._pvpRecv[i] = d; }
        });
        update();
      });
    }).catch(() => {
      cancelBtn.disableInteractive();
      cancelBtn.setText('Connection failed');
    });
  }

  showCodeEntry() {
    const w = 800, h = 600;
    let entered = '';
    const overlay = this.add.graphics();
    overlay.fillStyle(0x0a0a1a, 0.95);
    overlay.fillRect(0, 0, w, h);
    overlay.setDepth(20);
    overlay.setInteractive(new Phaser.Geom.Rectangle(0, 0, w, h), Phaser.Geom.Rectangle.Contains);

    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const title = this.add.text(w / 2, 80, 'Enter PvP Code', { fontSize: '22px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(25);
    const codeDisplay = this.add.text(w / 2, 160, '_ _ _ _ _ _', { fontSize: '48px', fill: '#fff', fontFamily: 'monospace', fontStyle: 'bold' }).setOrigin(0.5).setDepth(25);

    const updateDisplay = () => { codeDisplay.setText(entered.padEnd(6, '_').split('').join(' ')); };

    const keyHandler = (e) => {
      const ch = e.key.toUpperCase();
      if (chars.includes(ch) && entered.length < 6) {
        entered += ch; updateDisplay();
      } else if (e.key === 'Backspace') {
        entered = entered.slice(0, -1); updateDisplay();
      } else if (e.key === 'Enter' && entered.length === 6) {
        cleanup(); this.joinMatch(entered);
      }
    };
    window.addEventListener('keydown', keyHandler);

    const cleanup = () => {
      window.removeEventListener('keydown', keyHandler);
      overlay.destroy(); title.destroy(); codeDisplay.destroy();
      submitBtn.destroy(); cancelBtn.destroy(); pasteBtn.destroy();
    };

    const submitBtn = this.add.text(w / 2 - 90, 280, '[ Submit ]', { fontSize: '18px', fill: '#4CAF50', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    submitBtn.on('pointerdown', () => { if (entered.length === 6) { cleanup(); this.joinMatch(entered); } });

    const cancelBtn = this.add.text(w / 2 + 90, 280, '[ Cancel ]', { fontSize: '18px', fill: '#f44336', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    cancelBtn.on('pointerdown', cleanup);

    const pasteBtn = this.add.text(w / 2, 340, '[ Paste ]', { fontSize: '16px', fill: '#66BB6A', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5).setDepth(25).setInteractive({ useHandCursor: true });
    pasteBtn.on('pointerdown', async () => {
      try {
        const text = await navigator.clipboard.readText();
        const filtered = text.toUpperCase().split('').filter(ch => chars.includes(ch)).join('').slice(0, 6);
        if (filtered.length > 0) { entered = filtered; updateDisplay(); pasteBtn.setText('✓ Pasted!'); this.time.delayedCall(800, () => pasteBtn.setText('[ Paste ]')); }
      } catch {}
    });
  }

  async joinMatch(code) {
    const w = 800, h = 600;
    const bg = this.add.graphics(); bg.fillStyle(0x0a0a1a, 0.95); bg.fillRect(0, 0, w, h); bg.setDepth(20);
    const status = this.add.text(400, 280, 'Connecting...', { fontSize: '18px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(30);
    try {
      const result = await window.GutRush.PvPManager.joinMatch(code.trim().toUpperCase());
      const { conn, peer, playerIdx, numPlayers } = result;
      window.GutRush._pvpConn = conn;
      window.GutRush._pvpPeer = peer;
      window.GutRush._pvpConns = [conn];
      window.GutRush._pvpNumPlayers = numPlayers;
      window.GutRush._pvpMyIdx = playerIdx;
      window.GutRush._pvpRecv = [];
      status.setText(`Waiting for host to start game... (player ${playerIdx + 1}/${numPlayers})`);
      this.tweens.add({ targets: status, alpha: 0.3, duration: 800, yoyo: true, repeat: -1 });
      conn.on('data', (d) => {
        if (d.type === 'game_start') {
          bg.destroy(); status.destroy();
          window.GutRush._pvpIsHost = false;
          window.GutRush.pvpCode = code.trim().toUpperCase();
          window.GutRush.pvpMode = true;
          this.startGame();
        } else {
          window.GutRush._pvpRecv[0] = d;
        }
      });
    } catch (e) {
      bg.destroy();
      status.setText(e.message);
    }
  }
};

    this.startBtn = this.add.text(w / 2, 548, '[ Start Digestion! ]', { fontSize: '18px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true });

      this.readyBtn.on('pointerdown', () => this.sendReady());
    }
    this.updateUI();

    const catColors = {
      'Vegetables': 0x4CAF50, 'Fruits': 0xFF9800, 'Junk Food': 0xf44336,
      'Drinks': 0x2196F3, 'Grains': 0xCD853F, 'Legumes': 0x8BC34A, 'Fats/Seeds': 0xFFE0B2,
      'Interactable': 0x9C27B0
    };

    const cols = 4;
    const cardW = 180, cardH = 90;
    const startX = 20, startY = 60;
    const gapX = 10, gapY = 6;

    // Scrollable container for cards
    this.cardContainer = this.add.container(0, 0);

    // Mask for scrollable region
    const maskShape = this.make.graphics({ add: false });

    this.foodCards = [];

    this.scrollMax = 0;

    this.foods.forEach((food, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = startX + col * (cardW + gapX);

      rg.lineStyle(1, 0x0f3460, 1);

      // Category color bar
      const catColor = catColors[food.cat] || 0x888888;
      const catBar = this.add.graphics();
      catBar.fillStyle(catColor, 0.8);
      catBar.fillRoundedRect(x + 2, y + 2, cardW - 4, 14, 3);
      const catText = this.add.text(x + cardW / 2, y + 9, food.cat, { fontSize: '14px', fill: '#fff', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5);

      // Food icon
      const icon = this.add.graphics();
      icon.fillStyle(catColor, 1);
      icon.fillRoundedRect(x + 6, y + 20, 40, 40, 5);
      icon.fillStyle(0xffffff, 0.15);
      icon.fillRect(x + 10, y + 24, 32, 32);

      // Food name
      const nameText = this.add.text(x + 52, y + 22, food.name, { fontSize: '13px', fill: '#fff', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 });

      // Cost with coin icon
      const costText = this.add.text(x + 52, y + 52, `🪙 ${food.coins}`, { fontSize: '14px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 });

      // Description
      const descBg = this.add.graphics();
      descBg.fillStyle(0x000000, 0.5);
      descBg.fillRoundedRect(x + 4, y + 66, cardW - 8, 20, 3);
      const descText = this.add.text(x + 8, y + 68, food.desc || '', { fontSize: '12px', fill: '#fff', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 0.5, wordWrap: { width: cardW - 16 } });

      const hitArea = this.add.zone(x + cardW / 2, y + cardH / 2, cardW, cardH).setInteractive({ useHandCursor: true });

      // Add all card elements to the container
      this.cardContainer.add([rg, catBar, catText, icon, nameText, costText, descBg, descText, hitArea, ownedBadge]);

      const card = { food, rg, catText, icon, nameText, costText, descText, hitArea, ownedBadge, x, y, cardW, cardH };
      this.foodCards.push(card);

      hitArea.on('pointerdown', () => this.buyFood(food, card));
      const inView = () => y + (this.scrollY || 0) + cardH >= 54 && y + (this.scrollY || 0) <= 518;
      hitArea.on('pointerover', () => { if (!inView()) return; rg.clear(); rg.fillStyle(0x1a3a5c, 0.9); rg.fillRoundedRect(x, y, cardW, cardH, 6); rg.lineStyle(1, 0x0f3460, 1); rg.strokeRoundedRect(x, y, cardW, cardH, 6); });
      hitArea.on('pointerout', () => { if (!inView()) return; rg.clear(); rg.fillStyle(0x16213e, 0.9); rg.fillRoundedRect(x, y, cardW, cardH, 6); rg.lineStyle(1, 0x0f3460, 1); rg.strokeRoundedRect(x, y, cardW, cardH, 6); });
    });

    // Calculate max scroll
    const totalRows = Math.ceil(this.foods.length / cols);
    const totalHeight = startY + totalRows * (cardH + gapY);
    const visibleHeight = 465;
    this.scrollMax = Math.max(0, totalHeight - visibleHeight);

    // Scroll via drag
    this.input.on('pointermove', (pointer) => {
      if (!pointer.isDown || this._dragStartY === undefined) return;
      const delta = pointer.y - this._dragStartY;
      if (Math.abs(delta) < 3) return;
      this.scrollY = Phaser.Math.Clamp(this.scrollY - delta * 0.8, -this.scrollMax, 0);
      this.cardContainer.y = this.scrollY;
      this._dragStartY = pointer.y;
    });

    this.input.on('pointerdown', (pointer) => {
      this._dragStartY = pointer.y;
    });

    this.input.on('pointerup', () => {
      this._dragStartY = undefined;
    });

    // Scroll via mouse wheel
    this.input.on('wheel', (pointer, gameObjects, deltaX, deltaY) => {
      this.scrollY = Phaser.Math.Clamp(this.scrollY - deltaY * 0.5, -this.scrollMax, 0);
      this.cardContainer.y = this.scrollY;
    });

    // PvP ready/steal listener (unified for N players)
    if (window.GutRush.pvpMode) {
      this._opponentReady = {};
      this._opponentFoods = {};
      this._allReady = false;
      const conns = window.GutRush._pvpConns || [];
      const isHost = window.GutRush._pvpIsHost;
      const myIdx = window.GutRush._pvpMyIdx;
      const total = window.GutRush._pvpNumPlayers;

      const onAllReady = (d) => {
        this._allReady = true;
        this.cart = d.foods.map(id => window.GutRush.FOODS.find(f => f.id === id)).filter(Boolean);
        this.updateUI();
        if (d.stolen) this.showStolenText(d.stolen);
        if (this.readyBtn) { this.readyBtn.setText('[ Ready ✓ ]').setFill('#4CAF50'); this.readyBtn.removeAllListeners('pointerdown'); }
        this.startBtn.removeAllListeners('pointerdown');
        this.startBtn.on('pointerdown', () => this.startDigestion());
      };

      const checkAllReady = () => {
        if (!this._readySent) return;
        const allReady = Object.keys(this._opponentReady).length === total - 1 &&
          Object.values(this._opponentReady).every(Boolean);
        if (allReady) this.processPvPReady();
      };

      conns.forEach((conn) => {
        if (!conn) return;
        conn.on('data', (d) => {
          if (d.type === 'ready') {
            this._opponentReady[d.playerIdx] = true;
            this._opponentFoods[d.playerIdx] = d.foods;
            if (isHost) checkAllReady();
          } else if (d.type === 'all_ready') {
            onAllReady(d);
          }
        });
      });
    }
  }

  persist() {
    if (!window.GutRush.pvpMode) window.GutRush.saveGame({ coins: this.coins, cart: this.cart.map(f => f.id), scene: 'ShopScene' });
  }

  updateUI() {
    this.coinText.setText(`🪙 ${this.coins} coins`);
    const waterCount = this.cart.filter(f => f.id === 'water').length;
    this.waterBtn.setText(`[ Buy Water (-5 coins) ]${waterCount > 0 ? ` x${waterCount}` : ''}`);
    if (this.cart.length === 0) {
      this.cartText.setText('Cart: empty');
    } else {
      const counts = {};
      this.cart.forEach(f => { counts[f.name] = (counts[f.name] || 0) + 1; });
      const parts = Object.entries(counts).map(([n, c]) => c > 1 ? `${n} x${c}` : n);
      this.cartText.setText(`Cart: ${parts.join(', ')}`);
    }
    this.startBtn.removeAllListeners('pointerdown');
    this.startBtn.on('pointerdown', () => this.startDigestion());
  }

  buyWater() {
    const waterItem = window.GutRush.FOODS.find(f => f.id === 'water');
    if (!waterItem) return;
    if (this.coins < waterItem.coins) {
      const flash = this.add.text(this.coinText.x, this.coinText.y + 18, 'Not enough coins!', { fontSize: '13px', fill: '#f44336', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5);
      this.tweens.add({ targets: flash, alpha: 0, duration: 1000, onComplete: () => flash.destroy() });
      return;
    }
    this.coins -= waterItem.coins;
    this.cart.push(waterItem);
    this.updateUI();
  }

  buyFood(food, card) {
    const ct = card.y + (this.scrollY || 0);
    if (ct + card.cardH < 54 || ct > 518) return;
    if (this.coins < food.coins) {
      const flash = this.add.text(this.coinText.x, this.coinText.y + 18, 'Not enough coins!', { fontSize: '13px', fill: '#f44336', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5);
      this.tweens.add({ targets: flash, alpha: 0, duration: 1000, onComplete: () => flash.destroy() });
      return;
    }
    this.coins -= food.coins;
    this.cart.push(food);
    card.rg.clear();
    card.rg.fillStyle(0x1a3a2e, 0.9);
    card.rg.fillRoundedRect(card.x, card.y, card.cardW, card.cardH, 6);
    card.rg.lineStyle(1, 0x0f3460, 1);
    card.rg.strokeRoundedRect(card.x, card.y, card.cardW, card.cardH, 6);
    const count = this.cart.filter(f => f.id === food.id).length;
    card.ownedBadge.setText(count > 1 ? `x${count}` : '✓');
    this.updateUI();
  }

  sendReady() {
    if (!window.GutRush._pvpConns || this._readySent) return;
    this._readySent = true;
    if (this.readyBtn) this.readyBtn.setText('[ Sent ]').setFill('#aaa').disableInteractive();
    const foodIds = this.cart.map(f => f.id);
    const myIdx = window.GutRush._pvpMyIdx;
    const conns = window.GutRush._pvpConns || [];
    conns.forEach(c => { if (c) c.send({ type: 'ready', foods: foodIds, playerIdx: myIdx }); });
    if (window.GutRush._pvpIsHost) this.processPvPReady();
  }

  processPvPReady() {
    if (!window.GutRush._pvpIsHost) return;
    this._allReady = true;
    const myIdx = window.GutRush._pvpMyIdx;
    const allFoods = { [myIdx]: this.cart.map(f => f.id) };
    Object.keys(this._opponentFoods).forEach(idx => { allFoods[Number(idx)] = [...this._opponentFoods[idx]]; });
    const r = this.calcSteals(allFoods);
    const conns = window.GutRush._pvpConns || [];
    Object.keys(r.foods).forEach(idx => {
      const i = Number(idx);
      if (i === myIdx) {
        this.cart = r.foods[i].map(id => window.GutRush.FOODS.find(f => f.id === id)).filter(Boolean);
      } else {
        const connIdx = i - 1;
        if (conns[connIdx]) conns[connIdx].send({ type: 'all_ready', foods: r.foods[i], stolen: r.stolen[i] });
      }
    });
    this.updateUI();
    if (r.stolen[myIdx]) this.showStolenText(r.stolen[myIdx]);
    if (this.readyBtn) { this.readyBtn.setText('[ Ready ✓ ]').setFill('#4CAF50'); this.readyBtn.removeAllListeners('pointerdown'); }
    this.startBtn.removeAllListeners('pointerdown');
    this.startBtn.on('pointerdown', () => this.startDigestion());
  }

  calcSteals(allPlayerFoods) {
    const findName = id => { const f = window.GutRush.FOODS.find(x => x.id === id); return f ? f.name : id; };
    const indices = Object.keys(allPlayerFoods).map(Number);
    const foods = {}, fnCounts = {}, stolen = {};
    indices.forEach(idx => {
      foods[idx] = [...allPlayerFoods[idx]];
      fnCounts[idx] = foods[idx].filter(f => f === 'fanum_tax').length;
      stolen[idx] = null;
    });
    indices.forEach(selfIdx => {
      for (let i = 0; i < fnCounts[selfIdx]; i++) {
        const targets = indices.filter(t => t !== selfIdx);
        const target = targets[Math.floor(Math.random() * targets.length)];
        const targetArr = foods[target];
        if (Math.random() < 0.2 && targetArr.length > 0) {
          const si = Math.floor(Math.random() * targetArr.length);
          const stolenId = targetArr.splice(si, 1)[0];
          foods[selfIdx].push(stolenId);
          stolen[target] = findName(stolenId);
        }
      }
    });
    const result = {};
    indices.forEach(idx => { result[idx] = foods[idx].filter(f => f !== 'fanum_tax'); });
    return { foods: result, stolen };
  }

  showStolenText(foodName) {
    const txt = this.add.text(400, 300, `STOLEN!!! ${foodName}`, { fontSize: '28px', fill: '#FF4444', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(50).setScale(0.2);
    this.tweens.add({ targets: txt, scale: 1.4, duration: 600, ease: 'Back.easeOut', yoyo: true, hold: 800, onComplete: () => txt.destroy() });
  }

  startDigestion() {
    this.cart = this.cart.filter(f => f.cat !== 'Interactable');
    this.persist();
    this.cameras.main.fadeOut(300, 10, 10, 30);
    this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('EatScene', { foods: this.cart, coins: this.coins }));
  }
};

  updateBolus() {
    this.elapsed += 16;
    this.pathProgress = Math.min(1, this.elapsed / this.totalTime);
    const remaining = Math.max(0, (this.totalTime - this.elapsed) / 1000);
    this.tapText.setText(`Taps: ${this.tapCount} | ${remaining.toFixed(1)}s left`);

    if (this.pathProgress >= 1) {
      if (this._transitioning) return;
      this._transitioning = true;
      this.canTap = false;
      this.tapText.setText('Proceeding to elimination...');
      window.GutRush.SoundFX.randomPop();
      this.time.delayedCall(800, () => {
        this.cameras.main.fadeOut(300, 10, 10, 30);
        this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('PopScene', { foods: this.foods, result: this.result, tapCount: this.tapCount, coinsLeft: this.coinsLeft, digestionStartTime: this.digestionStartTime }));
      });
      return;
    }

    const segs = this.bolusPath.length;
    const fi = this.pathProgress * (segs - 1);
    const iA = Math.floor(fi);
    const iB = Math.min(iA + 1, segs - 1);
    const t = fi - iA;
    const pA = this.bolusPath[iA];
    const pB = this.bolusPath[iB];

    if (pA && pB && iA < segs) {
      this.bolusX = Phaser.Math.Linear(pA.x, pB.x, t);
      this.bolusY = Phaser.Math.Linear(pA.y, pB.y, t);
      this.bolusG.clear();
      const c = iA < 3 ? 0x8B6914 : iA < 6 ? 0x6B8B3A : iA < 10 ? 0x5D3A1A : 0x3a2a0a;
      this.bolusG.fillStyle(c, 0.9);
      this.bolusG.fillCircle(this.bolusX, this.bolusY, 7);

      // Sound effects
      if (this.time.now - this._lastBolusSoundTime > 350) {
        window.GutRush.SoundFX.randomSquelch();
        this._lastBolusSoundTime = this.time.now;
      }
      if ((iA === 4 || iA === 8) && this.time.now - this._lastCreakSoundTime > 1500) {
        window.GutRush.SoundFX.randomCreak();
        this._lastCreakSoundTime = this.time.now;
      }

      // Water droplets effect
      if (this.totalWater > 0 && iA < 10) {
        const dropCount = Math.min(5, Math.ceil(this.totalWater));
        const fade = iA < 6 ? 0.6 : 0.3;
        for (let d = 0; d < dropCount; d++) {
          const angle = (d / dropCount) * Math.PI * 2 + this.elapsed * 0.001;
          const dist = 12 + (d % 3) * 4;
          this.bolusG.fillStyle(0x4488ff, fade * (1 - iA / 12));
          this.bolusG.fillCircle(this.bolusX + Math.cos(angle) * dist, this.bolusY + Math.sin(angle * 0.7) * dist - 4, 3);
        }
      }

      const labelMap = [0, 1, 1, 2, 2, 2, 3, 4, 5, 6, 6, 7, 8, 9, 10, 10];
      if (iA >= 0 && iA < labelMap.length) {
        const li = labelMap[iA];
        if (li < this.organLabels.length) this.organLabels[li].setAlpha(Math.min(1, this.organLabels[li].alpha + 0.05));
      }
    }
  }

  _miniComplete(success) {
    this._miniGameActive = false;
    const remaining = (this.totalTime - this.elapsed) / 1000;
    let msg, color;
    if (success) {
      const boost = (remaining * 0.1).toFixed(1);
      this.elapsed += remaining * 0.1 * 1000;
      msg = `✅ MINIGAME CLEAR! +${boost}s speed boost!`;
      color = '#4CAF50';
    } else {
      this.elapsed = this._elapsedBeforeMiniGame;
      const rem2 = (this.totalTime - this.elapsed) / 1000;
      const penalty = (rem2 * 0.5).toFixed(1);
      this.elapsed -= rem2 * 0.5 * 1000;
      msg = `❌ FAILED! Reset + ${penalty}s time penalty!`;
      color = '#f44336';
    }
    const ft = this.add.text(400, 300, msg, { fontSize: '18px', fill: color, fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 3 }).setOrigin(0.5).setDepth(50);
    this.tweens.add({ targets: ft, alpha: 0, y: 280, duration: 2000, onComplete: () => ft.destroy() });
  }

  // 1. The Dreaded Speed Check
  speedCheck() {
    const w = 800, h = 600;
    const g = this.add.graphics(); g.setDepth(30);
    g.fillStyle(0x0a0a1a, 0.95); g.fillRect(0, 0, w, h); g.setInteractive(new Phaser.Geom.Rectangle(0, 0, w, h), Phaser.Geom.Rectangle.Contains);

    const hint = this.add.text(w / 2, 100, 'Tap when the indicator is in the GREEN zone!', { fontSize: '12px', fill: '#aaa', fontFamily: 'Arial, sans-serif' }).setOrigin(0.5).setDepth(35);

    const barG = this.add.graphics(); barG.setDepth(35);
    barG.fillStyle(0x333333, 0.8); barG.fillRoundedRect(gaugeX, gaugeY, gaugeW, gaugeH, 6);
    barG.fillStyle(0x2a6a3a, 0.6); barG.fillRect(gaugeX + gaugeW * 0.425, gaugeY, gaugeW * 0.15, gaugeH);
    let pos = 0, dir = 1, speed = 0.025, stopped = false;
    const marker = this.add.graphics(); marker.setDepth(36);
    const result = this.add.text(w / 2, 300, '', { fontSize: '18px', fill: '#fff', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(35);
    const timer = this.time.addEvent({ delay: 16, loop: true, callback: () => {
      if (stopped) return;
      pos += speed * dir;
      if (pos >= 1 || pos <= 0) dir *= -1;
      marker.clear();
      marker.fillStyle(0xFFD700, 1);
      marker.fillTriangle(gaugeX + pos * gaugeW - 6, gaugeY - 6, gaugeX + pos * gaugeW + 6, gaugeY - 6, gaugeX + pos * gaugeW, gaugeY + 6);
      marker.fillRect(gaugeX + pos * gaugeW - 2, gaugeY, 4, gaugeH);
    } });
    const tapZone = this.add.zone(w / 2, h / 2, w, h).setInteractive({ useHandCursor: true }).setDepth(35);
    tapZone.on('pointerdown', () => {
      if (stopped) return;
      stopped = true; timer.destroy();
      const pct = pos;
      if (pct >= 0.425 && pct <= 0.575) {
        result.setText('✅ Good Read! +1s');
        result.setFill('#4CAF50');
        this.time.delayedCall(1000, () => { g.destroy(); title.destroy(); hint.destroy(); barG.destroy(); marker.destroy(); result.destroy(); tapZone.destroy(); this._miniComplete(true); });
      } else if (pct < 0.425) {
        result.setText('❌ Bad Read. Too Fast.');
        result.setFill('#f44336');
        this.time.delayedCall(1200, () => { g.destroy(); title.destroy(); hint.destroy(); barG.destroy(); marker.destroy(); result.destroy(); tapZone.destroy(); this._miniComplete(false); });
      } else {
        result.setText('❌ Bad Read. Too Slow.');
        result.setFill('#f44336');
        this.time.delayedCall(1200, () => { g.destroy(); title.destroy(); hint.destroy(); barG.destroy(); marker.destroy(); result.destroy(); tapZone.destroy(); this._miniComplete(false); });

  // 2. Sequence Memory (5 rounds)
  seqMemory() {
    const w = 800, h = 600;
    const g = this.add.graphics(); g.setDepth(30);
    g.fillStyle(0x0a0a1a, 0.95); g.fillRect(0, 0, w, h); g.setInteractive(new Phaser.Geom.Rectangle(0, 0, w, h), Phaser.Geom.Rectangle.Contains);
    const title = this.add.text(w / 2, 30, '🧠 SEQUENCE MEMORY', { fontSize: '20px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(35);
    const statusTxt = this.add.text(w / 2, 60, '', { fontSize: '14px', fill: '#aaa', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(35);
    const clean = () => { g.destroy(); title.destroy(); statusTxt.destroy(); btns.forEach(b => { b.bg.destroy(); b.zone.destroy(); }); };
    const gridX = 285, gridY = 130, size = 70, gap = 10;
    const btns = [], btnG = [];
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        const bx = gridX + c * (size + gap), by = gridY + r * (size + gap);
        const bg = this.add.graphics(); bg.setDepth(36);
        bg.fillStyle(0x1a3a6a, 0.9); bg.fillRoundedRect(bx, by, size, size, 6);
        const zone = this.add.zone(bx + size / 2, by + size / 2, size, size).setInteractive({ useHandCursor: true }).setDepth(37);
        btns.push({ bg, zone, bx, by, idx: r * 3 + c });
        btnG.push(bg);
      }
    }
    let sequence = [], playerIdx = 0, round = 0, playing = false, inputLocked = true;
    const flash = (idx, cb) => {
      const b = btns[idx];
      b.bg.clear(); b.bg.fillStyle(0x66aaff, 1); b.bg.fillRoundedRect(b.bx, b.by, size, size, 6);
      this.time.delayedCall(200, () => { b.bg.clear(); b.bg.fillStyle(0x1a3a6a, 0.9); b.bg.fillRoundedRect(b.bx, b.by, size, size, 6); if (cb) cb(); });
    };
    const playSeq = (cb) => {
      playing = true; inputLocked = true;
      let i = 0;
      const next = () => {
        if (i >= sequence.length) { playing = false; inputLocked = false; if (cb) cb(); return; }
        flash(sequence[i], () => { this.time.delayedCall(150, next); });
        i++;
      };
      next();
    };
    const nextRound = () => {
      round++;
      if (round > 5) {
        statusTxt.setText('All rounds complete!');
        const res = this.add.text(w / 2, 520, '✅ Memory mastered! +1s', { fontSize: '18px', fill: '#4CAF50', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(40);
        this.time.delayedCall(1000, () => { clean(); res.destroy(); this._miniComplete(true); });
        return;
      }
      statusTxt.setText(`Round ${round}/5 — Watch the sequence...`);
      sequence.push(Math.floor(Math.random() * 9));
      playerIdx = 0;
      this.time.delayedCall(500, () => playSeq(() => { statusTxt.setText(`Round ${round}/5 — Your turn!`); }));
    };
    btns.forEach(b => {
      b.zone.on('pointerdown', () => {
        if (inputLocked || playing) return;
        flash(b.idx);
        if (b.idx === sequence[playerIdx]) {
          playerIdx++;
          if (playerIdx >= sequence.length) nextRound();
        } else {
          statusTxt.setText('❌ Wrong!');
          const res = this.add.text(w / 2, 520, '❌ Sequence failed -0.5s', { fontSize: '18px', fill: '#f44336', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(40);
          this.time.delayedCall(1200, () => { clean(); res.destroy(); this._miniComplete(false); });
        }
      });
    });
    nextRound();
  }
};

      const gn = ctx.createGain();

      gn.gain.exponentialRampToValueAtTime(0.01, t + 0.5 + i * 0.1);
      osc.connect(gn).connect(ctx.destination);
      osc.start(t + 0.25 + i * 0.1);
      osc.stop(t + 0.5 + i * 0.1);
    });
  },
  squelch2() {
    this._ensure();
    const ctx = this._ctx, t = ctx.currentTime;
    const len = ctx.sampleRate * 0.1;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const p = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.sin(p * Math.PI * 6) * Math.exp(-p * 7) * 0.3;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 350; flt.Q.value = 2;
    const gn = ctx.createGain(); gn.gain.value = 0.18;
    src.connect(flt).connect(gn).connect(ctx.destination);
    src.start(t);
  },
  squelch3() {
    this._ensure();
    const ctx = this._ctx, t = ctx.currentTime;
    const len = ctx.sampleRate * 0.15;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const p = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.sin(p * Math.PI * 14) * Math.exp(-p * 4) * 0.25;
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 280; flt.Q.value = 4;
    const gn = ctx.createGain(); gn.gain.value = 0.22;
    src.connect(flt).connect(gn).connect(ctx.destination);
    src.start(t);
  },
  creak2() {
    this._ensure();
    const ctx = this._ctx, t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.setValueAtTime(70, t);
    osc.frequency.linearRampToValueAtTime(50, t + 0.2);
    const flt = ctx.createBiquadFilter();
    flt.type = 'lowpass'; flt.frequency.value = 90;
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.15, t);
    gn.gain.linearRampToValueAtTime(0.05, t + 0.2);
    gn.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
    osc.connect(flt).connect(gn).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.35);
  },
  pop2() {
    this._ensure();
    const ctx = this._ctx, t = ctx.currentTime;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(300, t);
    osc.frequency.exponentialRampToValueAtTime(900, t + 0.03);
    osc.frequency.exponentialRampToValueAtTime(150, t + 0.15);
    const gn = ctx.createGain();
    gn.gain.setValueAtTime(0.3, t);
    gn.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
    osc.connect(gn).connect(ctx.destination);
    osc.start(t); osc.stop(t + 0.15);
  },
  randomSquelch() {
    const r = Math.random();
    if (r < 0.33) this.squelch();
    else if (r < 0.66) this.squelch2();
    else this.squelch3();
  },
  randomCreak() {
    Math.random() < 0.5 ? this.creak() : this.creak2();
  },
  randomPop() {
    Math.random() < 0.5 ? this.pop() : this.pop2();
  }
};

      this.egestionRating = 'BAD';

      this.egestionBristol = 3;
      this.egestionSkill = 1.5;
      this.egestionRating = 'OK';
    } else if (this.holdDuration < 1.7) {
      this.egestionBristol = 4;
      this.egestionSkill = 2.5;
      this.egestionRating = 'GOOD';
    } else if (this.holdDuration < 2.1) {
      this.egestionBristol = 4;
      this.egestionSkill = 3.5;
      this.egestionRating = 'IDEAL';
    } else if (this.holdDuration < 2.6) {
      this.egestionBristol = 4;
      this.egestionSkill = 2.5;
      this.egestionRating = 'GOOD';
    } else if (this.holdDuration < 3.2) {
      this.egestionBristol = 5;
      this.egestionSkill = 1.5;
      this.egestionRating = 'OK';
    } else if (this.holdDuration < 4.0) {
      this.egestionBristol = 6;
      this.egestionSkill = 0.8;
      this.egestionRating = 'BAD';
    } else {
      this.egestionBristol = 7;
      this.egestionSkill = 0.3;
      this.egestionRating = 'DIARRHEA!';
    }

    this.roundSkills.push(this.egestionSkill);
    this.round++;
    this.holdTimeText.setText(`Round ${this.round}/${this.maxRounds}: ${this.holdDuration.toFixed(1)}s`);

    const ratingColors = { 'IDEAL': '#4CAF50', 'GOOD': '#42A5F5', 'OK': '#FF9800', 'BAD': '#f44336', 'DIARRHEA!': '#FF0000' };
    this.statusText.setText(this.egestionRating);
    this.statusText.setFill(ratingColors[this.egestionRating] || '#fff');
    this.statusText.setAlpha(1);

    if (this.egestionRating === 'DIARRHEA!') {
      this.cameras.main.shake(500, 0.03);
    } else if (this.egestionRating === 'IDEAL' || this.egestionRating === 'GOOD') {
      window.GutRush.SoundFX.splash();
    }

    if (this.round < this.maxRounds) {
      this.roundText.setText(`Round ${this.round + 1} of ${this.maxRounds} — tap to start next`);
      // Reset for next round after brief delay
      this.time.delayedCall(1000, () => {
        this.statusText.setAlpha(0);
        this.stoolTypeText.setText('');
        this.holdTimeText.setText(`Round ${this.round + 1}/${this.maxRounds} — hold!`);
        this.stoolG.clear();
        this.gaugeMarker.clear();
        this.popped = false;
        this.holdDuration = 0;
        this.isHolding = false;
      });
    } else {
      // All rounds done — proceed to ScoreScene
      const avgSkill = this.roundSkills.reduce((a, b) => a + b, 0) / this.roundSkills.length;
      this.resultText.setText(`Final score: ${avgSkill.toFixed(1)}`);
      this.resultText.setAlpha(1);
      this.time.delayedCall(1500, () => {
        this.cameras.main.fadeOut(300, 10, 10, 30);
        this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('ScoreScene', {
          foods: this.foods, result: this.result, tapCount: this.tapCount,
          coinsLeft: this.coinsLeft, egestionSkill: avgSkill,
          digestionStartTime: this.digestionStartTime
        }));
      });
    }
  }
};

      const y = startY + i * 40;
      this.add.text(30, y, `${item.name}: ${item.score}/${item.max}`, { fontSize: '15px', fill: '#fff', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 });
      const barBg = this.add.rectangle(250, y + 8, 200, 12, 0x333333).setOrigin(0, 0.5);
      const barWidth = 200 * (item.score / item.max);
      const barColor = (item.score / item.max) >= 0.7 ? 0x4CAF50 : (item.score / item.max) >= 0.4 ? 0xFF9800 : 0xf44336;
      this.add.rectangle(250, y + 8, barWidth, 10, barColor).setOrigin(0, 0.5);
      this.add.text(470, y, item.detail, { fontSize: '14px', fill: '#ccc', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1, wordWrap: { width: 300 } });
    });

    let yOffset = startY + 5 * 40 + 15;
    this.add.text(w / 2, yOffset, '--- What Happened ---', { fontSize: '16px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5);
    yOffset += 18;

    const explanation = this.result.scoreLabel || 'No data';
    this.add.text(w / 2, yOffset, explanation, { fontSize: '14px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1, wordWrap: { width: 700 }, align: 'center' }).setOrigin(0.5);
    yOffset += 18;

    const fiberTotal = this.result.totalFiber || 0;
    const fatTotal = this.result.totalFat || 0;
    const waterTotal = this.result.totalWater || 0;
    const timeStr = this.totalElapsed >= 60 ? `${(this.totalElapsed / 60).toFixed(1)}m` : `${this.totalElapsed.toFixed(0)}s`;
    this.add.text(w / 2, yOffset, `Fiber: ${fiberTotal.toFixed(1)}g | Fat: ${fatTotal.toFixed(1)}g | Water: ${waterTotal.toFixed(1)}x | Foods: ${this.foods.length} | Time: ${timeStr}`, {
      fontSize: '14px', fill: '#ddd', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1
    }).setOrigin(0.5);
    yOffset += 18;

    if (this.foods.length > 0) {
      const foodList = this.foods.map(f => f.name).join(', ');
      this.add.text(w / 2, yOffset, `Your meal: ${foodList}`, { fontSize: '13px', fill: '#aaa', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1, wordWrap: { width: 700 }, align: 'center' }).setOrigin(0.5);
      yOffset += 16;
    }

    const idealFiber = 'Ideal: 20-30g fiber + water for Type 3-4 stool';
    this.add.text(w / 2, yOffset, idealFiber, { fontSize: '14px', fill: '#66BB6A', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5);
    yOffset += 20;

    this.add.text(w / 2, yOffset, '--- PvP Mode ---', { fontSize: '16px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5);
    yOffset += 20;

    this.pvpStatusText = this.add.text(w / 2, yOffset, '', { fontSize: '14px', fill: '#ddd', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 }).setOrigin(0.5);
    this.pvpPanel = this.add.graphics();
    this.pvpPanelTexts = [];
    this._pvpDone = false;

    const numP = window.GutRush._pvpNumPlayers;
    if (window.GutRush.pvpMode && window.GutRush._pvpConns) {
      const conns = window.GutRush._pvpConns;
      const isHost = window.GutRush._pvpIsHost;
      const myIdx = window.GutRush._pvpMyIdx;

      const showWait = () => {
        const rest = numP - 1;
        this.pvpStatusText.setText(`Waiting for ${rest} player${rest > 1 ? 's' : ''} to finish...`);
        this.tweens.add({ targets: this.pvpStatusText, alpha: 0.3, duration: 800, yoyo: true, repeat: -1 });
      };
      const showMatch = (match) => {
        this._pvpDone = true;
        this.tweens.killTweensOf(this.pvpStatusText);
        this.pvpStatusText.setAlpha(1);
        this.pvpStatusText.setText('Match complete!');
        window.GutRush.pvpMode = false;
        this.showPvPComparison(match);
        this.time.delayedCall(400, () => {
          const cleanup = () => {
            if (window.GutRush._pvpPeer) { window.GutRush._pvpPeer.destroy(); window.GutRush._pvpPeer = null; }
            if (window.GutRush._pvpConns) { window.GutRush._pvpConns.forEach(c => { try { c.close(); } catch {} }); window.GutRush._pvpConns = null; }
          };
          this.add.text(w / 2 - 100, yOffset + 30, '[ Play Again ]', { fontSize: '18px', fill: '#4CAF50', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true }).on('pointerdown', () => {
            cleanup(); window.GutRush.clearGame();
            this.cameras.main.fadeOut(300, 10, 10, 30);
            this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('ShopScene'));
          });
          this.add.text(w / 2 + 100, yOffset + 30, '[ Main Menu ]', { fontSize: '18px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true }).on('pointerdown', () => {
            cleanup(); window.GutRush.clearGame();
            this.cameras.main.fadeOut(300, 10, 10, 30);
            this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('BootScene'));
          });
        });
      };

      const processMsg = (data) => {
        if (!data || this._pvpDone) return;
        if (isHost && data.type === 'score') {
          if (!this._pvpScores) this._pvpScores = {};
          this._pvpScores[data.playerIdx] = { name: data.name, score: data.score, breakdown: data.breakdown, result: data.result };
          const allIn = Object.keys(this._pvpScores).length >= numP - 1;
          if (allIn) {
            const match = { [myIdx]: { name: window.GutRush.playerName || 'Host', score: this.score.total, breakdown: this.score.breakdown, result: this.result } };
            Object.keys(this._pvpScores).forEach(idx => { match[Number(idx)] = this._pvpScores[idx]; });
            showMatch(match);
            conns.forEach(c => { if (c) c.send({ type: 'match', match }); });
          }
        } else if (!isHost && data.type === 'match') {
          showMatch(data.match);
        }
      };

      window.GutRush._pvpRecv.forEach((d, i) => { if (d) this.time.delayedCall(i * 10, () => processMsg(d)); });
      window.GutRush._pvpRecv = [];

      if (isHost) {
        conns.forEach(c => { if (c) c.on('data', processMsg); });
        if (!this._pvpDone) showWait();
      } else {
        conns[0].send({ type: 'score', score: this.score.total, breakdown: this.score.breakdown, result: this.result, name: window.GutRush.playerName || 'Joiner', playerIdx: window.GutRush._pvpMyIdx });
        conns[0].on('data', processMsg);
        if (!this._pvpDone) showWait();
      }
    }

    const isPvpLocal = !!window.GutRush._pvpConns;
    if (!isPvpLocal) {
      const playAgain = this.add.text(w / 2, yOffset + 30, '[ Play Again ]', { fontSize: '20px', fill: '#e94560', fontFamily: 'Arial, sans-serif', fontStyle: 'bold' }).setOrigin(0.5).setDepth(10).setInteractive({ useHandCursor: true });
      playAgain.on('pointerdown', () => {
        window.GutRush.clearGame();
        this.cameras.main.fadeOut(300, 10, 10, 30);
        this.cameras.main.once('camerafadeoutcomplete', () => this.scene.start('ShopScene'));
      });
    }
  }

  showPvPComparison(match) {
    const w = 800, h = 600;
    const cx = w / 2;
    const players = Object.values(match).filter(Boolean);
    const count = players.length;
    if (count < 2) return;

    const panelH = 20 + count * 34;
    const py = Math.max(240, 300 - panelH / 2);
    const barW = 200, barH = 16;

    this.pvpPanel.clear();
    this.pvpPanel.lineStyle(1, 0x444466, 0.6);
    this.pvpPanel.strokeRoundedRect(cx - 220, py - 10, 440, panelH, 8);
    this.pvpPanel.fillStyle(0x1a1a3a, 0.5);
    this.pvpPanel.fillRoundedRect(cx - 220, py - 10, 440, panelH, 8);

    this.pvpPanelTexts.forEach(t => t.destroy());
    this.pvpPanelTexts = [];

    const maxScore = Math.max(...players.map(p => p.score), 1);
    const winner = window.GutRush.PvPManager.getWinner(match);
    const gradeColor = s => s >= 80 ? '#4CAF50' : s >= 50 ? '#FF9800' : '#f44336';
    const gradeColorInt = s => s >= 80 ? 0x4CAF50 : s >= 50 ? 0xFF9800 : 0xf44336;

    const addPVP = (label, score, idx) => {
      const y = py + 10 + idx * 34;
      const txt = this.add.text(cx - 200, y, `${label}: ${score}`, { fontSize: '15px', fill: gradeColor(score), fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 1 });
      this.pvpPanelTexts.push(txt);
      const barBg = this.add.rectangle(cx, y + 12, barW, barH, 0x333333).setOrigin(0, 0.5);
      this.pvpPanelTexts.push(barBg);
      const bar = this.add.rectangle(cx, y + 12, barW * (score / maxScore), barH - 2, gradeColorInt(score)).setOrigin(0, 0.5);
      this.pvpPanelTexts.push(bar);
    };

    players.forEach((p, i) => addPVP(p.name, p.score, i));

    const resultY = py + 10 + count * 34 + 10;
    const resultTxt = this.add.text(cx + 150, resultY, winner ? `Winner: ${winner.name}` : 'Tie!', { fontSize: '16px', fill: '#FFD700', fontFamily: 'Arial, sans-serif', fontStyle: 'bold', stroke: '#000', strokeThickness: 2 }).setOrigin(0.5);
    this.pvpPanelTexts.push(resultTxt);
  }
};

const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  parent: "game-container",
  backgroundColor: "#1a1a2e",
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH,
  },
  scene: [
    window.GutRush.BootScene,
    window.GutRush.ShopScene,
    window.GutRush.EatScene,
    window.GutRush.DigestionScene,
    window.GutRush.PopScene,
    window.GutRush.ScoreScene,
  ],
};

const game = new Phaser.Game(config);
</script>
</body>
</html>
